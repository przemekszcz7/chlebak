name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        # This is a placeholder for the user's specific deployment target.
        # Common targets are GitHub Pages, Vercel, Netlify, or Firebase.
        # Since I don't know the target, I'll provide a comment.
        run: echo "Build successful. Ready for deployment to your preferred hosting provider."
